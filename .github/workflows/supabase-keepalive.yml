name: Supabase Keep-Alive

on:
  schedule:
    # A few daily database requests keep Free-plan activity steady without visitors.
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Supabase
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -Eeuo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Supabase secrets missing::Set SUPABASE_URL and SUPABASE_ANON_KEY in repository Actions secrets."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"
          if [[ ! "$SUPABASE_URL" =~ ^https://[^/[:space:]]+$ ]]; then
            echo "::error title=Invalid SUPABASE_URL::Use https://<project-ref>.supabase.co with no path or whitespace."
            exit 1
          fi

          echo "Sending one-row query to Supabase..."
          HTTP_STATUS=$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")

          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "::error title=Supabase ping failed::REST endpoint returned HTTP $HTTP_STATUS."
            exit 1
          fi

          echo "Supabase activity recorded (HTTP $HTTP_STATUS)."
